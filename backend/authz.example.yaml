# Namespace access map for the hubble-ui backend.
#
# Enable it with AUTHZ_POLICY_FILE=/path/to/this/file. The backend then reads
# the user from the identity headers set by the authentication proxy in front
# of hubble-ui (AUTHZ_USER_HEADERS, AUTHZ_GROUPS_HEADER) and shows a user only
# the namespaces granted by the rules that match them. No matching rule means
# no namespaces at all.
#
# Namespaces are glob patterns as in Go's path.Match; "*" grants everything.
# groupPattern is a regular expression over the user's groups, and ${1} in the
# namespaces stands for the captured part of the group name (lowercased).
rules:
  # the platform team sees everything
  - groups: ["devops"]
    namespaces: ["*"]

  # members of development-<team> see <team> and <team>-* without being listed
  - groupPattern: "^development-(.+)$"
    namespaces: ["${1}", "${1}-*"]

  # explicit grants still work
  - users: ["alice@example.com"]
    namespaces: ["sandbox-alice"]
